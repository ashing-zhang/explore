services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:3000"
      DATA_PROVIDER: "odps"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:3001/api"
    ports:
      - "3000:3000"
    depends_on:
      - backend
